name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_native_brew_paths.py'
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/upmacx-arm64 ./cmd/upmacx
      - name: Native macOS help and version smoke test
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "arm64"
          go build -trimpath -o dist/upmacx-native ./cmd/upmacx
          test "$(./dist/upmacx-native --version)" = "upmacx dev"
          ./dist/upmacx-native --help
          uname -m
